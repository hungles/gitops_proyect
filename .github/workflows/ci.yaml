name: CI/CD Pipeline (Harbor)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  REGISTRY: ${{ secrets.HARBOR_URL || 'harbor.local:30002' }}
  PROJECT: ${{ secrets.HARBOR_PROJECT || 'gitops' }}

jobs:
  build-and-push-frontend:
    # Se ejecuta en el runner local, que tiene acceso a Harbor y Docker.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine environment tag
        id: env_tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_TAG=prod" >> $GITHUB_OUTPUT
            echo "IS_PROD=true" >> $GITHUB_OUTPUT
          else
            echo "ENV_TAG=dev" >> $GITHUB_OUTPUT
            echo "IS_PROD=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Harbor Registry
        uses: docker/login-action@v2
        if: ${{ secrets.HARBOR_USERNAME != '' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT }}/frontend
          tags: |
            type=raw,value=${{ steps.env_tag.outputs.ENV_TAG }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.env_tag.outputs.IS_PROD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/frontend
          # Si se configuraron secretos de Harbor y no es un PR, hace push al registro
          push: ${{ github.event_name != 'pull_request' && secrets.HARBOR_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-backend:
    # Se ejecuta en el runner local, que tiene acceso a Harbor y Docker.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine environment tag
        id: env_tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_TAG=prod" >> $GITHUB_OUTPUT
            echo "IS_PROD=true" >> $GITHUB_OUTPUT
          else
            echo "ENV_TAG=dev" >> $GITHUB_OUTPUT
            echo "IS_PROD=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Harbor Registry
        uses: docker/login-action@v2
        if: ${{ secrets.HARBOR_USERNAME != '' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT }}/backend
          tags: |
            type=raw,value=${{ steps.env_tag.outputs.ENV_TAG }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.env_tag.outputs.IS_PROD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/backend
          # Si se configuraron secretos de Harbor y no es un PR, hace push al registro
          push: ${{ github.event_name != 'pull_request' && secrets.HARBOR_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
