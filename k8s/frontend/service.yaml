apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  # Using NodePort to expose it locally for testing purposes. 
  # In a real cluster, you would likely use an Ingress or LoadBalancer.
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

