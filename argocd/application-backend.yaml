apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tu-usuario/gitops_proyect.git' # UPDATE THIS
    targetRevision: dev
    path: k8s/backend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

